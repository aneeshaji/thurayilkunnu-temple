<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Peacock Teal Squircle Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16B8A8"/>
      <stop offset="55%" stop-color="#0E8E82"/>
      <stop offset="100%" stop-color="#0B6359"/>
    </linearGradient>

    <!-- Radiant Metallic Gold Gradient -->
    <linearGradient id="velGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89C"/>
      <stop offset="35%" stop-color="#F2C96B"/>
      <stop offset="70%" stop-color="#D9A62E"/>
      <stop offset="100%" stop-color="#996F15"/>
    </linearGradient>

    <linearGradient id="velHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFF3C4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D9A62E" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="velShadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73500A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3D2900" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Modern rounded squircle base -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="none" stroke="#F3D27B" stroke-width="1.6" opacity="0.7"/>

  <!-- Classic Vel Spear -->
  <g transform="translate(0, 0)">
    <path
      d="M 50,14
         C 53,20  57,26  61,33
         C 65,40  68,47  65,54
         C 63,61  57,66  53,70
         L 53,75
         L 47,75
         L 47,70
         C 43,66  37,61  35,54
         C 32,47  35,40  39,33
         C 43,26  47,20  50,14 Z"
      fill="url(#velGold)"
      stroke="#FFF1B8"
      stroke-width="0.8"
      stroke-linejoin="round"
    />
    <path
      d="M 50,14
         C 47,20  43,26  39,33
         C 35,40  32,47  35,54
         C 37,61  43,66  47,70
         L 47,75
         L 50,75 Z"
      fill="url(#velHighlight)"
    />
    <path
      d="M 50,14
         C 53,20  57,26  61,33
         C 65,40  68,47  65,54
         C 63,61  57,66  53,70
         L 53,75
         L 50,75 Z"
      fill="url(#velShadow)"
    />

    <!-- Central Ridge -->
    <path d="M 50,16 L 50,75" stroke="#FFE596" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Sacred Vibhuti Marks -->
    <path d="M 44,38 L 56,38" stroke="#FFF7D6" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <path d="M 43,41 L 57,41" stroke="#FFF7D6" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <path d="M 44,44 L 56,44" stroke="#FFF7D6" stroke-width="1" stroke-linecap="round" opacity="0.9"/>

    <!-- Sacred Kumkum Dot -->
    <circle cx="50" cy="41" r="1.8" fill="#E63946" stroke="#FFE596" stroke-width="0.4"/>

    <!-- Vel Shaft -->
    <rect x="47.8" y="74" width="4.4" height="13" rx="1" fill="url(#velGold)"/>
  </g>
</svg>