name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'

  workflow_dispatch:

jobs:
  deploy-server:
    name: Deploy Node.js Server
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Upload source files only (NO node_modules) ─────────────────────
      #  We exclude node_modules here and let cPanel run npm install itself.
      #  This avoids uploading thousands of files over FTP (was timing out).
      # ──────────────────────────────────────────────────────────────────────
      - name: Deploy source files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     21
          protocol: ftp
          local-dir:  ./server/
          server-dir: /thurayilkunnutemple.com-server/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            **/node_modules/**

      # ── 3. Run npm install on cPanel via UAPI ─────────────────────────────
      #  cPanel Node.js App API installs deps & restarts the app automatically.
      #  Requires: CPANEL_USERNAME and CPANEL_API_TOKEN secrets.
      #  Create the token: cPanel → Security → Manage API Tokens → Create
      # ──────────────────────────────────────────────────────────────────────
      - name: Install dependencies & restart via cPanel API
        # continue-on-error: FTP deploy already succeeded; don't fail the whole
        # job just because the cPanel API step has a cert or auth issue.
        continue-on-error: true
        run: |
          echo "Running npm install on cPanel..."
          # -k skips SSL cert verification (cPanel uses self-signed cert on :2083)
          curl -skf \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/NodeJS/npm_install?app_name=thurayilkunnutemple.com-server" \
            -o /tmp/npm_install.json || echo "npm_install API call failed (exit $?)"
          cat /tmp/npm_install.json 2>/dev/null || true

          echo "Restarting Node.js app..."
          curl -skf \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/NodeJS/restart_app?app_name=thurayilkunnutemple.com-server" \
            -o /tmp/restart.json || echo "restart_app API call failed (exit $?)"
          cat /tmp/restart.json 2>/dev/null || true
          echo "Done. If API calls failed, manually restart the Node.js app in cPanel."
