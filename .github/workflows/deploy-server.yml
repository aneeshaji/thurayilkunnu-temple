name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy-server:
    name: Deploy Node.js Server
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install server production dependencies ──────────────────────────
      - name: Install server dependencies (production only)
        working-directory: ./server
        run: npm ci --omit=dev

      # ── 3. Deploy server/ → cPanel Node.js app directory via FTP ───────────
      #
      #  On cPanel, set up a Node.js App pointing at:
      #    Application Root : thurayilkunnutemple.com-server
      #    Application Startup File: server.js
      #
      #  The FTP server-dir below must match the Application Root you chose.
      # ──────────────────────────────────────────────────────────────────────
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     21
          protocol: ftpes
          local-dir:  ./server/
          # This folder must match what you set as "Application Root" in cPanel
          server-dir: /thurayilkunnutemple.com-server/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
