             C 54,16 60,24 66,32
             C 71,40 73,48 70,56
             C 67,64 59,70 54,74
             L 54,82
             L 46,82
             L 46,74
             C 41,70 33,64 30,56
             C 27,48 29,40 34,32
             C 40,24 46,16 50,8 Z" />

    <!-- Central Ridge Spine -->
    <line x1="50" y1="12" x2="50" y2="82" stroke-width="1.8" />

    <!-- Sacred Thripundra Lines -->
    <line x1="42" y1="36" x2="58" y2="36" stroke-width="1.5" opacity="0.9" />
    <line x1="40" y1="41" x2="60" y2="41" stroke-width="1.5" opacity="0.9" />
    <line x1="42" y1="46" x2="58" y2="46" stroke-width="1.5" opacity="0.9" />

    <!-- Sacred Kumkum Circle Accent -->
