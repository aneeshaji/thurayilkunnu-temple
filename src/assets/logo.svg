    <!-- Handle Base & Knob -->
    <line x1="50" y1="82" x2="50" y2="94" stroke-width="2.2" />
    <circle cx="50" cy="94" r="2.8" fill="url(#goldLineGrad)" stroke="none" />
  </g>
</svg>