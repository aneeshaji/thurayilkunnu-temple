<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89C"/>
      <stop offset="50%" stop-color="#F2C96B"/>
      <stop offset="100%" stop-color="#D9A62E"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#goldLineGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
